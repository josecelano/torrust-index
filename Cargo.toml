[package]
authors = ["Nautilus Cyberneering <info@nautilus-cyberneering.de>"]
categories = ["algorithms", "data-structures"]
description = "φ-Bounded Geometric-Value Graph"
documentation = "https://docs.rs/crate/torrust-mudlark/"
edition = "2024"
homepage = "https://torrust.com"
keywords = [
    "adaptive",
    "data-structure",
    "dual-tree",
    "sampling",
    "spatial-index",
]
license = "AGPL-3.0-only"
name = "torrust-mudlark"
publish = true
readme = "README.md"
repository = "https://github.com/torrust/torrust-mudlark"
rust-version = "1.85"
version = "1.0.0"

[lints.rust]
deprecated-safe = { level = "deny", priority = -1 }
future-incompatible = { level = "deny", priority = -1 }
let-underscore = { level = "deny", priority = -1 }
nonstandard-style = { level = "deny", priority = -1 }
rust-2018-compatibility = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
rust-2021-compatibility = { level = "deny", priority = -1 }
rust-2024-compatibility = { level = "deny", priority = -1 }
unsafe-code = "warn"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
needless_return = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[features]
default = ["dynamic-contour-tracking", "rand"]
dynamic-contour-tracking = []
rand = ["dep:rand_core"]
serde = ["dep:serde"]

[dependencies]
rand_core = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tracing = "0"

[dev-dependencies]
crossterm = "0.29"
insta = "1"
ratatui = "0.30"
rstest = "0.24"
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "depth"
harness = false
